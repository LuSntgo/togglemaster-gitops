apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 239510186324.dkr.ecr.us-east-1.amazonaws.com/auth-service:ca8ee83bf7107aba37f1198042b7c55734c2cde6
        ports:
        - containerPort: 8080