apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
      - name: evaluation-service
        image: 239510186324.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:82d7136e9c73988b14eb7d268c689abf6c743f6c
        ports:
        - containerPort: 8080