apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
      - name: evaluation-service
        image: 186107385777.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:23a80424590fda5f41669bb153773a0f278b4ab7
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: evaluation-service-config
        - secretRef:
            name: togglemaster-secrets
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=prod,service.version=1.0.0
        - name: OTEL_SERVICE_NAME
          value: evaluation-service
