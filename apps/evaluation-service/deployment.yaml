apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
      - name: evaluation-service
        image: 239510186324.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:052ec12f0571638774980e11df95a135f8d5033c
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: evaluation-service-config
