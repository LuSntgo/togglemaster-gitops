apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
      - name: flag-service
        image: 186107385777.dkr.ecr.us-east-1.amazonaws.com/flag-service:23a80424590fda5f41669bb153773a0f278b4ab7
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=prod,service.version=1.0.0
        - name: OTEL_SERVICE_NAME
          value: flag-service
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
