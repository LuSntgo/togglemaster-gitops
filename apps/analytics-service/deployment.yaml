apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: 239510186324.dkr.ecr.us-east-1.amazonaws.com/analytics-service:82d7136e9c73988b14eb7d268c689abf6c743f6c
        ports:
        - containerPort: 5000