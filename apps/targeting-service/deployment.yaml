apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
      - name: targeting-service
        image: 186107385777.dkr.ecr.us-east-1.amazonaws.com/targeting-service:23a80424590fda5f41669bb153773a0f278b4ab7
        ports:
        - containerPort: 8080